{% extends "base.html" %}
{% block title %}Passwort ändern · AWAS{% endblock %}
{% block content %}
  <section class="page-heading compact-heading">
    <div>
      <p class="eyebrow">Mein Konto</p>
      <h1>Passwort ändern</h1>
    </div>
  </section>
  <section class="panel form-panel">
    {% if error %}<div class="notice notice-error" role="alert">{{ error }}</div>{% endif %}
    <form method="post" action="/account/password" class="form-stack">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <label>
        <span>Aktuelles Passwort</span>
        <input type="password" name="current_password" required maxlength="128" autocomplete="current-password">
      </label>
      <label>
        <span>Neues Passwort</span>
        <input type="password" name="new_password" required maxlength="128" autocomplete="new-password">
      </label>
      <label>
        <span>Neues Passwort wiederholen</span>
        <input type="password" name="new_password_confirmation" required maxlength="128" autocomplete="new-password">
      </label>
      <div class="form-actions">
        {% if not user.must_change_password %}<a class="button button-quiet" href="/">Abbrechen</a>{% endif %}
        <button class="button button-primary" type="submit">Passwort ändern</button>
      </div>
    </form>
  </section>
{% endblock %}
